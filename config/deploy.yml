service: ffdev

image: findingfocusdev/ffdev

servers:
  web:
    - 216.128.140.9
proxy:
  ssl: true
  host: findingfocus.dev
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 30

registry:
  username: findingfocusdev
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  driver: docker

env:
  secret:
   - SMTP_USER
   - SMTP_PASSWORD

ssh:
  user: findingfocus